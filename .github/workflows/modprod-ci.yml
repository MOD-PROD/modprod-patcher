name: Vérifier ModProd Patcher

on:
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'api/**'
      - '.github/workflows/modprod-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compilation et tests du fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compiler et tester
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew test jar --no-daemon --stacktrace
      - name: Vérifier strictement la compatibilité ABI
        id: abi
        run: ./gradlew apiCheck --no-daemon
      - name: Résumé de validation
        if: always()
        env:
          ABI_OUTCOME: ${{ steps.abi.outcome }}
        run: |
          echo "## ModProd Patcher — diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compilation et tests : consulter les étapes précédentes." >> "$GITHUB_STEP_SUMMARY"
          if [ "$ABI_OUTCOME" != "success" ]; then
            echo "::warning::ABI héritée non validée : ne pas activer ce moteur dans APK Factory."
            echo "- Compatibilité ABI : **NON VALIDÉE**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Compatibilité ABI : **validée**." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Contrôler les archives de la bibliothèque
        run: |
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)" || {
            echo "::error::Aucun JAR compilé par ModProd Patcher"
            exit 1
          }
          (cd build/libs && sha256sum -- *.jar) | tee modprod-patcher-sha256.txt
      - name: Enregistrer les bibliothèques compilées
        uses: actions/upload-artifact@v4
        with:
          name: modprod-patcher-build
          path: |
            build/libs/*.jar
            modprod-patcher-sha256.txt
          retention-days: 14
          if-no-files-found: error
